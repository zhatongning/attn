name: Build Attn

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    env:
      BUILD_ARCH: ${{ matrix.arch }}
      BUILD_TARGET: ${{ matrix.target }}
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.96.0"
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Test Rust
        run: npm run test:rust -- --locked

      - name: Build application and installer
        run: npm run tauri -- build --ci --target "$BUILD_TARGET" --bundles app,dmg -- --locked

      - name: Prepare download artifacts
        run: |
          bundle_dir="src-tauri/target/$BUILD_TARGET/release/bundle"
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            "$bundle_dir/macos/Attn.app" \
            "artifacts/Attn-$BUILD_ARCH.app.zip"
          cp "$bundle_dir/dmg/"*.dmg artifacts/
          (
            cd artifacts
            shasum -a 256 *.dmg *.zip > SHA256SUMS.txt
          )

      - name: Upload application and installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Attn-macOS-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

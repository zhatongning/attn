name: Build Attn

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    env:
      BUILD_ARCH: ${{ matrix.arch }}
      BUILD_TARGET: ${{ matrix.target }}
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate updater release version
        if: github.ref == 'refs/heads/master'
        run: node scripts/releaseVersion.mjs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.96.0"
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Test Rust
        run: npm run test:rust -- --locked

      - name: Configure signed updater build
        if: github.ref == 'refs/heads/master'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "::error title=Missing updater signing key::Set the TAURI_SIGNING_PRIVATE_KEY repository secret before publishing updates."
            exit 1
          fi

      - name: Build signed application and updater
        if: github.ref == 'refs/heads/master'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --ci --target "$BUILD_TARGET" --bundles app,dmg,updater --config '{"bundle":{"createUpdaterArtifacts":true}}' -- --locked

      - name: Build application and installer
        if: github.ref != 'refs/heads/master'
        run: npm run tauri -- build --ci --target "$BUILD_TARGET" --bundles app,dmg -- --locked

      - name: Prepare application and installer artifacts
        run: |
          bundle_dir="src-tauri/target/$BUILD_TARGET/release/bundle"
          mkdir -p artifacts
          shopt -s nullglob
          ditto -c -k --sequesterRsrc --keepParent \
            "$bundle_dir/macos/Attn.app" \
            "artifacts/Attn-macOS-$BUILD_ARCH.app.zip"
          installers=("$bundle_dir/dmg/"*.dmg)
          if [[ ${#installers[@]} != 1 || ! -f "${installers[0]}" ]]; then
            echo "Expected exactly one DMG installer"
            exit 1
          fi
          cp "${installers[0]}" "artifacts/Attn-macOS-$BUILD_ARCH.dmg"

          (
            cd artifacts
            shasum -a 256 \
              "Attn-macOS-$BUILD_ARCH.dmg" \
              "Attn-macOS-$BUILD_ARCH.app.zip" \
              > "Attn-macOS-$BUILD_ARCH.SHA256SUMS.txt"
          )

      - name: Prepare signed updater artifacts
        if: github.ref == 'refs/heads/master'
        run: |
          bundle_dir="src-tauri/target/$BUILD_TARGET/release/bundle"
          updater_archives=("$bundle_dir/macos/"*.app.tar.gz)
          updater_signatures=("$bundle_dir/macos/"*.app.tar.gz.sig)
          if [[ ${#updater_archives[@]} != 1 || ! -f "${updater_archives[0]}" ]]; then
            echo "Expected exactly one Tauri updater archive"
            exit 1
          fi
          if [[ ${#updater_signatures[@]} != 1 || ! -f "${updater_signatures[0]}" ]]; then
            echo "Expected exactly one Tauri updater signature"
            exit 1
          fi
          cp "${updater_archives[0]}" "artifacts/Attn-macOS-$BUILD_ARCH.app.tar.gz"
          cp "${updater_signatures[0]}" "artifacts/Attn-macOS-$BUILD_ARCH.app.tar.gz.sig"
          (
            cd artifacts
            shasum -a 256 \
              "Attn-macOS-$BUILD_ARCH.app.tar.gz" \
              "Attn-macOS-$BUILD_ARCH.app.tar.gz.sig" \
              >> "Attn-macOS-$BUILD_ARCH.SHA256SUMS.txt"
          )

      - name: Verify updater signature
        if: github.ref == 'refs/heads/master'
        run: |
          cargo run --manifest-path src-tauri/Cargo.toml --locked --example verify_updater_signature -- \
            "artifacts/Attn-macOS-$BUILD_ARCH.app.tar.gz" \
            "artifacts/Attn-macOS-$BUILD_ARCH.app.tar.gz.sig"

      - name: Upload application and installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Attn-macOS-${{ matrix.arch }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish latest download
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: attn-release-publishing
      cancel-in-progress: false
    steps:
      - name: Check out release publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download both application packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Attn-macOS-*-${{ github.sha }}
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { publishGithubRelease } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/publishGithubRelease.mjs`
            );
            const { readReleaseVersion } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/releaseVersion.mjs`
            );
            const result = await publishGithubRelease({
              github,
              context,
              assetDirectory: `${process.env.GITHUB_WORKSPACE}/release-assets`,
              version: await readReleaseVersion(process.env.GITHUB_WORKSPACE),
            });
            if (result.skipped) core.notice(result.reason);
            const summary = core.summary
              .addHeading("Download Attn")
              .addLink("Latest download page", result.latestUrl);
            if (result.url) summary.addLink("This build", result.url);
            await summary.write();
